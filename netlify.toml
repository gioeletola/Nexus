[build]
  command = "npm install"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Redirect /api/ai to the Netlify Function
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
